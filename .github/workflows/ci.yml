name: Oddiy CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tekshirish:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v6

      - name: Node.js tayyorlash
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: JavaScript tekshirish
        run: node --check script.js
